  <style>
    /* ========== DESIGN TOKENS ========== */
    :root {
      --bg: #C0C0C0;
      --fg: #000000;
      --gray: #808080;
      --dark: #404040;
      --light: #DFDFDF;
      --navy: #000080;
      --blue: #0000FF;
      --red: #FF0000;
      --yellow: #FFFF00;
      --green: #00FF00;
      --green-dk: #00AA00;
      --purple: #800080;
      --teal: #008080;
      --panel: #FFFFCC;
      --title-end: #1084D0;
    }

    /* ========== BASE ========== */
    html { scroll-behavior: auto; }
    * { border-radius: 0 !important; }
    body {
      font-family: "MS Sans Serif", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #000000;
      background-color: #C0C0C0;
      /* 90s tiled crosshatch pattern */
      background-image:
        linear-gradient(45deg, #b8b8b8 25%, transparent 25%),
        linear-gradient(-45deg, #b8b8b8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #b8b8b8 75%),
        linear-gradient(-45deg, transparent 75%, #b8b8b8 75%);
      background-size: 4px 4px;
      background-position: 0 0, 0 2px, 2px -2px, -2px 0px;
      line-height: 1.5;
    }
    h1, h2, h3 {
      font-family: "Arial Black", Impact, Haettenschweiler, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    a { color: #0000FF; text-decoration: underline; }
    a:visited { color: #800080; }
    a:hover { color: #FF0000; }
    ::selection { background: #000080; color: #FFFFFF; }
    :focus-visible {
      outline: 2px dotted #000000;
      outline-offset: 2px;
    }

    /* ========== 3D BEVEL SYSTEM ========== */
    .bevel-out {
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
    }
    .bevel-out-deep {
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow:
        inset -2px -2px 0 #808080,
        inset 2px 2px 0 #fff,
        inset -4px -4px 0 #404040,
        inset 4px 4px 0 #dfdfdf;
    }
    .bevel-in {
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
    }

    /* ========== BUTTONS ========== */
    .win-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      min-height: 2.5rem; padding: 6px 16px;
      background: #C0C0C0; color: #000000;
      font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;
      text-decoration: none;
      cursor: pointer;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
    }
    .win-btn:hover { background: #d0d0d0; color: #000; }
    .win-btn:active {
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
      transform: translate(1px, 1px);
    }
    .win-btn-blue {
      background: #0000FF; color: #FFFFFF;
      border-color: #5555ff #000080 #000080 #5555ff;
    }
    .win-btn-blue:hover { background: #3333FF; color: #fff; }
    .win-btn-red {
      background: #FF0000; color: #FFFFFF;
      border-color: #ff5555 #800000 #800000 #ff5555;
    }
    .win-btn-red:hover { background: #FF3333; color: #fff; }
    .win-btn-green {
      background: #00AA00; color: #FFFFFF;
      border-color: #00ff00 #006600 #006600 #00ff00;
    }
    .win-btn-green:hover { background: #00CC00; color: #fff; }
    .win-btn-navy {
      background: #000080; color: #FFFFFF;
      border-color: #3333AA #000040 #000040 #3333AA;
    }
    .win-btn-navy:hover { background: #0000A0; color: #fff; }
    .win-btn-sm {
      min-height: 1.75rem; padding: 2px 10px; font-size: 11px;
    }

    /* ========== INPUTS ========== */
    .win-input {
      width: 100%; background: #FFFFFF; color: #000000;
      padding: 6px 10px; font-weight: 700; font-size: 14px; min-height: 2.5rem;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
      font-family: inherit;
    }
    .win-input::placeholder { color: #808080; }
    .win-input:focus-visible {
      outline: 2px dotted #000000;
      outline-offset: 2px;
    }

    /* ========== WINDOWS TITLE BAR ========== */
    .win-titlebar {
      background: linear-gradient(to right, #000080, #1084D0);
      color: #FFFFFF;
      font-family: "Arial Black", Impact, sans-serif;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ========== WIN95 CARD ========== */
    .win-card {
      background: #C0C0C0;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
    }
    .win-card-body {
      background: #FFFFFF;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
      padding: 12px;
    }

    /* ========== BADGE ========== */
    .win-badge {
      display: inline-flex; align-items: center; gap: 4px;
      border: 2px solid #000; padding: 2px 8px;
      font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      background: #C0C0C0;
      text-decoration: none;
      color: #000;
    }

    /* ========== NAV ========== */
    .win-nav {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px;
      font-weight: 700; font-size: 13px;
      color: #000000; text-decoration: none;
      border: 2px solid transparent;
      background: transparent;
    }
    .win-nav:hover {
      background: #000080;
      color: #FFFFFF;
      border-color: #808080 #ffffff #ffffff #808080;
      text-decoration: none;
    }
    .win-nav.active {
      background: #000080;
      color: #FFFFFF;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #000040;
      text-decoration: none;
    }
    .win-nav.active:hover { background: #000080; }
    .win-section-title {
      font-size: 11px; font-weight: 900; text-transform: uppercase;
      letter-spacing: 0.2em; margin: 0 0 4px 4px;
      color: #808080;
    }

    /* ========== HR GROOVE ========== */
    .hr-groove {
      border: none;
      height: 4px;
      background: linear-gradient(to bottom, #808080 0%, #808080 50%, #ffffff 50%, #ffffff 100%);
      margin: 0;
    }

    /* ========== MARQUEE ========== */
    .win-marquee {
      overflow: hidden;
      border-bottom: 2px solid #000;
      background: #000080;
      color: #FFFF00;
      white-space: nowrap;
    }
    .win-marquee-track {
      display: inline-block;
      padding: 6px 0;
      animation: marquee 20s linear infinite;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 13px;
    }
    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* ========== RAINBOW TEXT ========== */
    .text-rainbow {
      animation: rainbow 4s linear infinite;
    }
    @keyframes rainbow {
      0%   { color: #ff0000; }
      17%  { color: #ff8000; }
      33%  { color: #ffff00; }
      50%  { color: #00ff00; }
      67%  { color: #0080ff; }
      83%  { color: #8000ff; }
      100% { color: #ff0000; }
    }

    /* ========== PULSE GLOW (NEW! badge) ========== */
    .pulse-glow {
      animation: pulse-glow 1.5s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 10px 2px rgba(255, 0, 0, 0.5);
      }
    }

    /* ========== BLINK ========== */
    .blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ========== CONSTRUCTION STRIPES ========== */
    .bg-construction {
      background: repeating-linear-gradient(
        45deg,
        #ffff00,
        #ffff00 10px,
        #000000 10px,
        #000000 20px
      );
    }

    /* ========== HIT COUNTER ========== */
    .hit-counter {
      background: #000080;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #000040, inset -1px -1px 0 #3333aa;
      color: #00FF00;
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      padding: 8px 16px;
      font-size: 14px;
      letter-spacing: 0.1em;
    }

    /* ========== TOAST ========== */
    #toast-root {
      position: fixed; right: 12px; bottom: 12px; z-index: 100;
      display: flex; flex-direction: column; gap: 8px;
      max-width: calc(100vw - 24px);
    }
    .toast {
      padding: 8px 14px;
      font-weight: 700; font-size: 13px;
      background: #C0C0C0;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
      animation: toast-pop 0.05s linear;
    }
    @keyframes toast-pop {
      from { transform: translate(4px, 4px); }
      to { transform: translate(0, 0); }
    }

    /* ========== PRISM OVERRIDE ========== */
    pre[class*="language-"] {
      margin: 0 !important; border-radius: 0 !important; background: #000 !important;
      font-family: "Courier New", Courier, monospace !important;
      font-size: 13px !important; line-height: 1.5 !important;
    }
    code[class*="language-"] {
      font-family: "Courier New", Courier, monospace !important;
    }

    /* ========== TEXT SHADOW 3D ========== */
    .text-3d {
      text-shadow: 2px 2px 0 #808080;
    }

    /* ========== SCROLLBAR (Win95 style) ========== */
    ::-webkit-scrollbar { width: 16px; height: 16px; }
    ::-webkit-scrollbar-track {
      background: #C0C0C0;
      border: 1px solid #808080;
    }
    ::-webkit-scrollbar-thumb {
      background: #C0C0C0;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: inset -1px -1px 0 #404040, inset 1px 1px 0 #dfdfdf;
    }
    ::-webkit-scrollbar-button {
      background: #C0C0C0;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      display: block;
      height: 16px; width: 16px;
    }

    /* ========== REDUCED MOTION ========== */
    @media (prefers-reduced-motion: reduce) {
      .text-rainbow { animation: none; color: #FF0000; }
      .pulse-glow { animation: none; }
      .blink { animation: none; }
      .win-marquee-track { animation: none; }
      .win-btn { transition: none; }
    }
  </style>
</head>

  <script>
    // ================= SUPABASE =================
    const SUPABASE_URL = "https://ubnqmyiwpppngekuctwe.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVibnFteWl3cHBwbmdla3VjdHdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NzY2NzgsImV4cCI6MjEwNzE1MjY3OH0.zWhQBF2gyeD7HrWB1L9ATTuLwv4pdkS6ZE6CHSnBB8Y";

    async function fetchUserRole(userId) {
      if (!userId) return 'user';
      const { data } = await db.from('profiles').select('role').eq('id', userId).single();
      return data?.role || 'user';
    }

    // ================= LANGUAGES (single source of truth) =================
    // v = value saved in DB, label = display text, icon = FontAwesome classes, prism = Prism grammar
    const LANGUAGES = [
      { v: 'HTML',       label: 'HTML',          icon: 'fa-brands fa-html5',   prism: 'markup' },
      { v: 'CSS',        label: 'CSS',           icon: 'fa-brands fa-css3-alt', prism: 'css' },
      { v: 'JavaScript', label: 'JavaScript',    icon: 'fa-brands fa-js',      prism: 'javascript' },

      { v: 'Dart',       label: 'Dart / Flutter', icon: 'fa-solid fa-code',    prism: 'dart' },
      { v: 'PHP',        label: 'PHP / Laravel', icon: 'fa-brands fa-php',     prism: 'php' },
      { v: 'Python',     label: 'Python',        icon: 'fa-brands fa-python',  prism: 'python' },
      { v: 'SQL',        label: 'SQL',           icon: 'fa-solid fa-database', prism: 'sql' },
      { v: 'Java',       label: 'Java',          icon: 'fa-brands fa-java',    prism: 'java' },
      { v: 'C#',         label: 'C#',            icon: 'fa-solid fa-code',     prism: 'csharp' },
      { v: 'Go',         label: 'Go',            icon: 'fa-solid fa-code',     prism: 'go' },
      { v: 'Rust',       label: 'Rust',          icon: 'fa-brands fa-rust',    prism: 'rust' },
      { v: 'Bash',       label: 'Bash / Shell',  icon: 'fa-solid fa-terminal', prism: 'bash' },
      { v: 'JSON',       label: 'JSON',          icon: 'fa-solid fa-file-code', prism: 'json' },
    ];

    const langOptions = (selected = '') => LANGUAGES.map(l =>
      `<option value="${escapeHtml(l.v)}" ${l.v === selected ? 'selected' : ''}>${escapeHtml(l.label)}</option>`
    ).join('');

    // ================= UI HELPERS =================
    function toast(msg, type = 'ok') {
      const colors = { ok: '#00AA00', err: '#FF0000', info: '#000080' };
      const textColors = { ok: '#FFFFFF', err: '#FFFFFF', info: '#FFFFFF' };
      const el = document.createElement('div');
      el.className = 'toast';
      el.style.background = colors[type] || colors.ok;
      el.style.color = textColors[type] || '#fff';
      el.style.borderColor = '#ffffff #808080 #808080 #ffffff';
      el.textContent = msg;
      document.getElementById('toast-root').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function getPrismLangClass(lang) {
      const l = (lang || '').toLowerCase();
      const found = LANGUAGES.find(x => x.v.toLowerCase() === l);
      return `language-${found ? found.prism : 'javascript'}`;
    }

    function getHashParams() {
      return new URLSearchParams(window.location.hash.split('?')[1] || '');
    }

    function marquee() {
      const items = [
        '<span style="color:#FFFF00">★ CODESTASH</span>',
        '<span style="color:#00FF00">SAVE YOUR CODE</span>',
        '<span style="color:#FF0000">★ HOT SNIPPETS</span>',
        '<span style="color:#00FFFF">COPY & PASTE</span>',
        '<span style="color:#FF00FF">★ SHIP IT</span>',
        '<span style="color:#FFFFFF">BEST VIEWED IN NETSCAPE NAVIGATOR</span>',
        '<span style="color:#FFFF00">★ WELCOME TO THE INFORMATION SUPERHIGHWAY</span>',
        '<span style="color:#00FF00">POWERED BY WEB 1.0</span>',
      ];
      const sep = '<span style="color:#808080;margin:0 16px">|</span>';
      const track = items.join(sep);
      return `<div class="win-marquee" aria-hidden="true"><div class="win-marquee-track">${(track + sep).repeat(4)}</div></div>`;
    }

    function hrGroove() {
      return '<hr class="hr-groove">';
    }

    function colorSquares() {
      const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF', '#FF8000', '#8000FF'];
      return colors.map(c =>
        `<div class="bevel-out" style="width:20px;height:20px;background:${c}"></div>`
      ).join('');
    }

    // ================= LAYOUT =================
    async function renderLayout(activeMenu, innerHtmlContent) {
      const { data: { session } } = await db.auth.getSession();
      currentUser = session?.user || null;
      if (currentUser) userRole = await fetchUserRole(currentUser.id);
      const userEmail = currentUser?.email || 'Developer';
      const userInitial = userEmail.substring(0, 2).toUpperCase();
      const params = getHashParams();
      const curPrivacy = params.get('privacy');
      const curLang = params.get('lang');
      const isDash = activeMenu === 'dashboard';

    async function fetchAndRenderSnippets() {
      const searchVal = document.getElementById('search-input')?.value.toLowerCase() || '';
      const params = getHashParams();
      const langVal = params.get('lang') || document.getElementById('lang-filter')?.value || '';
      const privacyQuery = params.get('privacy');

      let query = db.from('snippets').select('*').order('created_at', { ascending: false });
      if (privacyQuery === 'public') {
        query = query.eq('is_public', true);
      } else if (privacyQuery === 'private') {
        query = query.eq('is_public', false).eq('user_id', currentUser?.id);
      }

      const { data, error } = await query;
      const grid = document.getElementById('snippets-grid');
      if (!grid) return;

      if (error) {
        grid.innerHTML = `<div class="col-span-full bevel-in p-4" style="background:#FF0000;color:#FFF;font-weight:900"><i class="fa-solid fa-triangle-exclamation" style="margin-right:4px"></i> Failed to load data: ${escapeHtml(error.message)}</div>`;
        return;
      }

      // Private: no moderation. Public: visible if approved OR owned by current user (shows pending status).
      const filtered = data.filter(s => {
        const visible = (!s.is_public) || (s.is_approved === true) || (s.user_id === currentUser?.id);
        const matchTitle = s.title.toLowerCase().includes(searchVal);
        const matchTags = s.tags && s.tags.some(t => t.toLowerCase().includes(searchVal));
        const matchLang = !langVal || (s.language && s.language.toLowerCase() === langVal.toLowerCase());
        return visible && (matchTitle || matchTags) && matchLang;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full win-card">
            <div class="win-titlebar"><i class="fa-solid fa-folder-open" style="margin-right:4px"></i> NO RESULTS FOUND</div>
            <div class="p-6 text-center" style="background:#FFFFCC">
              <p style="font-family:'Arial Black',Impact,sans-serif;font-size:24px;text-transform:uppercase;margin-bottom:8px">Nothing here!</p>
              <p style="font-size:13px;margin-bottom:12px">No snippets found matching your criteria.</p>
              <a href="#/new" class="win-btn win-btn-navy"><i class="fa-solid fa-plus"></i> Create Your First Snippet</a>
            </div>
          </div>`;
        return;
      }

      const titleBarColors = [
        'linear-gradient(to right, #000080, #1084D0)',
        'linear-gradient(to right, #800000, #CC0000)',
        'linear-gradient(to right, #006600, #00AA00)',
      ];

      grid.innerHTML = filtered.map((s, i) => `
        <article class="win-card flex flex-col cursor-pointer" onclick="if(!event.target.closest('button')) location.hash='#/detail/${s.id}'" style="transition:none">
          <!-- Title bar -->
          <div class="win-titlebar justify-between" style="background:${titleBarColors[i % 3]}">
            <span style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(s.title)}</span>
            <div class="flex gap-1 shrink-0">
              <div class="bevel-out" style="width:14px;height:12px;background:#C0C0C0;font-size:7px;display:flex;align-items:center;justify-content:center;color:#000">_</div>
              <div class="bevel-out" style="width:14px;height:12px;background:#C0C0C0;font-size:7px;display:flex;align-items:center;justify-content:center;color:#000">□</div>
              <div class="bevel-out" style="width:14px;height:12px;background:#C0C0C0;font-size:7px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900">×</div>
            </div>
          </div>
          <!-- Toolbar -->
          <div class="flex items-center justify-between gap-2 flex-wrap p-2 border-b-2 border-[#808080]" style="background:#C0C0C0">
            <span class="win-badge" style="background:#FFFF00;color:#000"><i class="fa-solid fa-code"></i> ${escapeHtml(s.language)}</span>
            <div class="flex items-center gap-1 flex-wrap">
              ${s.is_public ? (s.is_approved
                ? `<span class="win-badge" style="background:#00AA00;color:#FFF"><i class="fa-solid fa-circle-check"></i> OK</span>`
                : `<span class="win-badge blink" style="background:#FF0000;color:#FFF"><i class="fa-solid fa-clock-rotate-left"></i> PENDING</span>`) : ''}
              <span class="win-badge" style="background:${s.is_public ? '#0000FF' : '#808080'};color:#FFF">${s.is_public ? '&#127760; Public' : '&#128274; Private'}</span>
            </div>
          </div>
          <!-- Content (sunken) -->
          <div class="bevel-in flex-1 m-2" style="background:#FFFFFF;padding:10px">
            <div class="flex flex-wrap gap-1 mb-2">
              ${(s.tags || []).map(t => `<span style="border:2px solid #000;background:#FFFF00;padding:1px 6px;font-size:10px;font-weight:900;text-transform:uppercase">#${escapeHtml(t)}</span>`).join('')}
            </div>
            <div class="bevel-in" style="max-height:120px;overflow:hidden;background:#000">
              <pre class="${getPrismLangClass(s.language)}"><code>${escapeHtml(s.code_content)}</code></pre>
            </div>
          </div>
          <!-- Footer -->
          <div class="flex items-center justify-between gap-2 p-2 border-t-2 border-[#ffffff]" style="background:#C0C0C0;border-top-color:#fff">
            <button onclick="event.stopPropagation(); copySnippetCode(this, \`${encodeURIComponent(s.code_content)}\`)" class="win-btn win-btn-sm"><i class="fa-regular fa-copy"></i> Copy</button>
            <span style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.05em;color:#0000FF;text-decoration:underline">Details &rarr;</span>
          </div>
        </article>
      `).join('');

      if (window.Prism) Prism.highlightAll();
    }

    // ================= 4. ADMIN =================
    async function renderAdminPanel(container) {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { location.hash = '#/login'; return; }

      userRole = await fetchUserRole(session.user.id);
      if (userRole !== 'admin') {
        toast("Access denied! You are not an admin.", 'err');
        location.hash = '#/dashboard';
        return;
      }

      const contentHtml = `
        <div class="p-3 sm:p-6" style="max-width:1024px;width:100%;margin:0 auto">
          <!-- Admin Header Window -->
          <div class="win-card mb-4">
            <div class="win-titlebar justify-between">
              <span><i class="fa-solid fa-user-shield" style="margin-right:4px"></i> ADMIN PANEL - MODERATION QUEUE</span>
              <div class="flex gap-1">
                <div class="bevel-out" style="width:16px;height:14px;background:#C0C0C0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000">_</div>
                <div class="bevel-out" style="width:16px;height:14px;background:#C0C0C0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000">□</div>
                <div class="bevel-out" style="width:16px;height:14px;background:#C0C0C0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000;font-weight:900">×</div>
              </div>
            </div>
            <div class="p-4" style="background:#C0C0C0">
              <div class="flex items-center gap-2 mb-2">
                <span class="win-badge pulse-glow" style="background:#FF0000;color:#FFF;border-color:#ff5555 #800000 #800000 #ff5555"><i class="fa-solid fa-exclamation-triangle"></i> REVIEW</span>
              </div>
              <h2 class="text-3d" style="font-size:28px;line-height:1">PENDING PUBLIC SNIPPETS</h2>
            </div>
          </div>

          <!-- Construction stripes warning -->
          <div class="bg-construction p-1 mb-4">
            <div class="bevel-in p-2" style="background:#FFFF00;text-align:center;font-weight:900;font-size:12px;text-transform:uppercase">
              &#9888; ADMIN AREA - AUTHORIZED PERSONNEL ONLY &#9888;
            </div>
          </div>

          <div id="admin-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 pb-8">
            <div class="col-span-full text-center py-8" style="font-weight:900;text-transform:uppercase;font-size:13px"><i class="fa-solid fa-spinner fa-spin" style="margin-right:6px"></i> Loading approval queue...</div>
          </div>
        </div>`;

      container.innerHTML = await renderLayout('admin', contentHtml);
      await fetchAndRenderAdminQueue();
    }

    async function fetchAndRenderAdminQueue() {
      const grid = document.getElementById('admin-grid');
      if (!grid) return;

      const { data, error } = await db.from('snippets').select('*').eq('is_public', true).eq('is_approved', false).order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = `<div class="col-span-full bevel-in p-4" style="background:#FF0000;color:#FFF;font-weight:900">Failed to load queue: ${escapeHtml(error.message)}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full win-card">
            <div class="win-titlebar"><i class="fa-solid fa-circle-check" style="margin-right:4px"></i> ALL CLEAR</div>
            <div class="p-8 text-center" style="background:#FFFFCC">
              <div style="font-size:48px;margin-bottom:8px">&#9989;</div>
              <p style="font-family:'Arial Black',Impact,sans-serif;font-size:20px;text-transform:uppercase;margin-bottom:4px">Queue is clear!</p>
              <p style="font-size:13px">All public snippets submitted by users have been approved.</p>
            </div>
          </div>`;
        return;
      }

      grid.innerHTML = data.map((s, i) => `
        <div id="snippet-card-${s.id}" class="win-card flex flex-col">
          <div class="win-titlebar justify-between">
            <span style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><i class="fa-solid fa-file-code" style="margin-right:4px"></i> ${escapeHtml(s.title)}</span>
            <span class="blink" style="font-size:10px;color:#FFFF00">&#9888; REVIEW</span>
          </div>
          <div class="p-3" style="background:#C0C0C0">
            <div class="bevel-in p-2 mb-2" style="background:#FFFFCC">
              <div class="flex items-center gap-2 flex-wrap mb-1">
                <span class="win-badge" style="background:#FFFF00;color:#000"><i class="fa-solid fa-code"></i> ${escapeHtml(s.language)}</span>
                <span class="win-badge" style="background:#FF0000;color:#FFF"><i class="fa-solid fa-clock"></i> Awaiting</span>
              </div>
              <p style="font-size:10px;font-family:'Courier New',monospace;color:#808080;word-break:break-all">User ID: ${escapeHtml(s.user_id)}</p>
            </div>
            <div class="bevel-in" style="max-height:160px;overflow-y:auto;background:#000">
              <pre class="${getPrismLangClass(s.language)}"><code>${escapeHtml(s.code_content)}</code></pre>
            </div>
          </div>
          <div class="flex flex-col sm:flex-row items-stretch sm:justify-end gap-2 p-3 border-t-2" style="background:#C0C0C0;border-top-color:#fff">
            <button onclick="handleAdminAction('${s.id}', 'reject')" class="win-btn win-btn-red"><i class="fa-solid fa-xmark"></i> Reject & Delete</button>
            <button onclick="handleAdminAction('${s.id}', 'approve')" class="win-btn win-btn-green"><i class="fa-solid fa-check"></i> Approve & Publish</button>
          </div>
        </div>
      `).join('');

      if (window.Prism) Prism.highlightAll();
    }

    window.handleAdminAction = async function(id, action) {
      if (action === 'approve') {
        const { error } = await db.from('snippets').update({ is_approved: true }).eq('id', id);
        if (error) toast("Failed to approve: " + error.message, 'err');
        else { toast("Public snippet approved!"); await fetchAndRenderAdminQueue(); }
      } else if (action === 'reject') {
        if (!confirm("Reject and delete this snippet from the system?")) return;
        const { error } = await db.from('snippets').delete().eq('id', id);
        if (error) toast("Failed to delete: " + error.message, 'err');
        else { toast("Snippet rejected and deleted.", 'info'); await fetchAndRenderAdminQueue(); }
      }
    }

    // ================= 5. DETAIL =================
    async function renderDetailSnippet(container, path) {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { location.hash = '#/login'; return; }

      const id = path.split('/')[2].split('?')[0];

      const contentHtml = `
        <div class="p-3 sm:p-6" style="max-width:1024px;width:100%;margin:0 auto">
          <div id="detail-content" class="win-card">
            <div class="win-titlebar"><i class="fa-solid fa-spinner fa-spin" style="margin-right:4px"></i> LOADING...</div>
            <div class="p-4" style="background:#C0C0C0">
              <p style="font-weight:900;text-transform:uppercase;font-size:13px">Loading snippet details...</p>
            </div>
          </div>
        </div>`;

      container.innerHTML = await renderLayout('dashboard', contentHtml);

      const { data: s, error } = await db.from('snippets').select('*').eq('id', id).single();
      const box = document.getElementById('detail-content');

      if (error || !s) {
        box.innerHTML = `
          <div class="win-titlebar"><i class="fa-solid fa-triangle-exclamation" style="margin-right:4px"></i> ERROR - NOT FOUND</div>
          <div class="p-6" style="background:#FFFFCC">
            <p style="font-family:'Arial Black',Impact,sans-serif;font-size:20px;text-transform:uppercase;margin-bottom:12px">Snippet not found or has been deleted.</p>
            <a href="#/dashboard" class="win-btn win-btn-navy"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
          </div>`;
        return;
      }

      box.innerHTML = `
        <!-- Title bar -->
        <div class="win-titlebar justify-between">
          <span><i class="fa-solid fa-file-code" style="margin-right:4px"></i> ${escapeHtml(s.title).toUpperCase()}</span>
          <div class="flex gap-1">
            <div class="bevel-out" style="width:16px;height:14px;background:#C0C0C0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000">_</div>
            <div class="bevel-out" style="width:16px;height:14px;background:#C0C0C0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000">□</div>
            <div class="bevel-out" style="width:16px;height:14px;background:#C0C0C0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000;font-weight:900">×</div>
          </div>
        </div>

        <!-- Toolbar row -->
        <div class="flex items-center justify-between gap-2 flex-wrap p-2" style="background:#C0C0C0;border-bottom:2px solid #808080">
          <a href="#/dashboard" class="win-btn win-btn-sm"><i class="fa-solid fa-arrow-left"></i> Back</a>
          <div class="flex items-center gap-1 flex-wrap">
            <span class="win-badge" style="background:#FFFF00;color:#000"><i class="fa-solid fa-code"></i> ${escapeHtml(s.language)}</span>
            ${s.is_public ? (s.is_approved
              ? `<span class="win-badge" style="background:#00AA00;color:#FFF"><i class="fa-solid fa-circle-check"></i> Approved</span>`
              : `<span class="win-badge blink" style="background:#FF0000;color:#FFF"><i class="fa-solid fa-clock-rotate-left"></i> Awaiting Review</span>`)
              : `<span class="win-badge" style="background:#808080;color:#FFF"><i class="fa-solid fa-lock"></i> Private</span>`}
            <span class="win-badge" style="background:${s.is_public ? '#0000FF' : '#808080'};color:#FFF">${s.is_public ? '&#127760; Public' : '&#128274; Private'}</span>
          </div>
        </div>

        <!-- Detail Body -->
        <div class="p-4" style="background:#C0C0C0">
          <!-- Title -->
          <h2 class="text-3d" style="font-size:28px;line-height:1.1;margin-bottom:12px">${escapeHtml(s.title)}</h2>

          <!-- Tags -->
          <div class="flex flex-wrap gap-1 mb-4">
            ${(s.tags || []).map(t => `<span style="border:2px solid #000;background:#FFFF00;padding:2px 8px;font-size:10px;font-weight:900;text-transform:uppercase">#${escapeHtml(t)}</span>`).join('')}
          </div>

          <!-- Code Window -->
          <div class="win-card mb-4">
            <div class="win-titlebar justify-between" style="padding:3px 6px">
              <div class="flex items-center gap-2">
                <span style="font-size:11px;font-family:'Courier New',monospace">${escapeHtml(s.language.toLowerCase())} editor</span>
              </div>
              <button onclick="copySnippetCode(this, \`${encodeURIComponent(s.code_content)}\`)" class="win-btn win-btn-sm" style="min-height:20px;padding:1px 8px;font-size:10px"><i class="fa-regular fa-copy"></i> Copy</button>
            </div>
            <div class="bevel-in m-1" style="background:#000">
              <pre class="${getPrismLangClass(s.language)}"><code>${escapeHtml(s.code_content)}</code></pre>
            </div>
          </div>

          ${hrGroove()}

          <!-- Meta info (table-like) -->
          <div class="bevel-in mt-4" style="background:#FFFFFF">
            <table style="width:100%;font-size:12px;border-collapse:collapse">
              <tr style="background:#E8E8E8">
                <td style="padding:6px 10px;border-right:2px solid #808080;border-bottom:2px solid #808080;font-weight:900;text-transform:uppercase;width:120px"><i class="fa-regular fa-clock" style="margin-right:4px"></i> Created</td>
                <td style="padding:6px 10px;border-bottom:2px solid #808080;font-family:'Courier New',monospace">${new Date(s.created_at).toLocaleString('en-US')}</td>
              </tr>
              <tr style="background:#FFFFFF">
                <td style="padding:6px 10px;border-right:2px solid #808080;font-weight:900;text-transform:uppercase"><i class="fa-solid fa-globe" style="margin-right:4px"></i> Privacy</td>
                <td style="padding:6px 10px;font-family:'Courier New',monospace">${s.is_public ? 'PUBLIC' : 'PRIVATE'}</td>
              </tr>
            </table>
          </div>

          ${(s.user_id === session.user.id || userRole === 'admin') ? `
            <div class="mt-4 flex justify-end">
              <button onclick="deleteSnippetAndRedirect('${s.id}')" class="win-btn win-btn-red"><i class="fa-solid fa-trash-can"></i> Delete This Snippet</button>
            </div>` : ''}
        </div>
      `;

      if (window.Prism) Prism.highlightAll();
    }

    window.deleteSnippetAndRedirect = async function(id) {
      if (!confirm("Are you sure you want to delete this snippet?")) return;
      const { error } = await db.from('snippets').delete().eq('id', id);
      if (error) toast("Failed to delete: " + error.message, 'err');
      else { toast("Snippet deleted.", 'info'); location.hash = '#/dashboard'; }
    }

    // ================= 6. NEW SNIPPET =================
    async function renderNewSnippet(container) {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { location.hash = '#/login'; return; }

      const contentHtml = `
        <div class="p-3 sm:p-6" style="max-width:768px;width:100%;margin:0 auto">
          <div class="win-card">
            <div class="win-titlebar justify-between">
              <span><i class="fa-solid fa-square-plus" style="margin-right:4px"></i> NEW SNIPPET - CREATE</span>
              <div class="flex gap-1">
                <div class="bevel-out" style="width:16px;height:14px;background:#C0C0C0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000">_</div>
                <div class="bevel-out" style="width:16px;height:14px;background:#C0C0C0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000">□</div>
                <div class="bevel-out" style="width:16px;height:14px;background:#C0C0C0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#000;font-weight:900">×</div>
              </div>
            </div>
            <div class="p-4" style="background:#C0C0C0">
              <!-- NEW badge -->
              <div class="flex items-center gap-2 mb-3">
                <span class="win-badge pulse-glow" style="background:#FF0000;color:#FFF;border-color:#ff5555 #800000 #800000 #ff5555"><i class="fa-solid fa-star"></i> NEW!</span>
                <h2 style="font-family:'Arial Black',Impact,sans-serif;font-size:22px;text-transform:uppercase;line-height:1">Add Snippet</h2>
              </div>

              <!-- Info box -->
              <div class="bevel-in p-2 mb-4" style="background:#FFFFCC;font-size:12px;font-weight:700">
                <i class="fa-solid fa-circle-info" style="color:#0000FF;margin-right:4px"></i>
                Public snippets require Admin review. Private snippets are saved instantly without approval.
              </div>

              <form id="snippet-form" class="space-y-3">
                <div>
                  <label style="display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:4px" for="title">Snippet Title</label>
                  <input type="text" id="title" required placeholder="e.g. Pluck Deep Array Function" class="win-input">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label style="display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:4px" for="language">Language / Framework</label>
                    <select id="language" class="win-input cursor-pointer">${langOptions('JavaScript')}</select>
                  </div>
                  <div>
                    <label style="display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:4px" for="tags">Tags (comma separated)</label>
                    <input type="text" id="tags" placeholder="js, array, helper" class="win-input">
                  </div>
                </div>

                <div>
                  <label style="display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:4px" for="code_content">Code</label>
                  <textarea id="code_content" rows="10" required placeholder="// Write your code here..." class="win-input" style="background:#000;color:#00FF00;font-family:'Courier New',Courier,monospace;font-size:13px" spellcheck="false"></textarea>
                </div>

                <label for="is_public" class="flex items-center gap-3 bevel-in p-3 cursor-pointer" style="background:#FFFFCC">
                  <input type="checkbox" id="is_public" checked style="width:20px;height:20px;accent-color:#000080" class="shrink-0">
                  <span style="font-size:12px;font-weight:900;text-transform:uppercase">&#127760; Publish this snippet (requires Admin approval)</span>
                </label>

                ${hrGroove()}

                <div class="flex flex-col-reverse sm:flex-row items-stretch sm:justify-end gap-2 pt-3">
                  <a href="#/dashboard" class="win-btn w-full sm:w-auto text-center">Cancel</a>
                  <button type="submit" class="win-btn win-btn-navy w-full sm:w-auto" style="min-height:2.75rem;font-size:14px"><i class="fa-solid fa-paper-plane"></i> SAVE SNIPPET</button>
                </div>
              </form>
            </div>
          </div>

          <!-- Construction CTA -->
          <div class="bg-construction p-2 mt-4">
            <div class="bevel-out p-3 text-center" style="background:#C0C0C0">
              <p style="font-family:'Arial Black',Impact,sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:0.05em">
                &#128679; THIS PAGE IS ALWAYS UNDER CONSTRUCTION &#128679;
              </p>
              <p style="font-size:11px;color:#808080;font-family:'Courier New',monospace">Last updated: ${new Date().toLocaleDateString('en-US')}</p>
            </div>
          </div>
        </div>`;

      container.innerHTML = await renderLayout('new', contentHtml);

      document.getElementById('snippet-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const language = document.getElementById('language').value;
        const code_content = document.getElementById('code_content').value;
        const tagsRaw = document.getElementById('tags').value;
        const is_public = document.getElementById('is_public').checked;
        const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

        // Private OR created by Admin => automatically approved
        const isApprovedStatus = (!is_public) || (userRole === 'admin');

        const { error } = await db.from('snippets').insert([{
          user_id: session.user.id, title, language, code_content, tags, is_public, is_approved: isApprovedStatus
        }]);

        if (error) {
          toast("Failed to save snippet: " + error.message, 'err');
        } else {
          if (!is_public) toast("Private snippet saved!");
          else if (userRole === 'admin') toast("Public snippet published!");
          else toast("Public snippet submitted! Awaiting Admin approval.", 'info');
          location.hash = '#/dashboard';
        }
      });
    }

    // ================= COPY =================
    window.copySnippetCode = function(btn, encodedCode) {
      const code = decodeURIComponent(encodedCode);
      navigator.clipboard.writeText(code).then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        btn.style.background = '#00AA00';
        btn.style.color = '#FFF';
        setTimeout(() => { btn.innerHTML = original; btn.style.background = ''; btn.style.color = ''; }, 1500);
      }).catch(() => toast("Failed to copy to clipboard.", 'err'));
    }

    // ================= ROUTER =================
    const routes = {
      "/": renderDashboard,
      "/dashboard": renderDashboard,
      "/login": renderLogin,
      "/register": renderRegister,
      "/new": renderNewSnippet,
      "/admin": renderAdminPanel,
      "/detail": renderDetailSnippet
    };

    async function router() {
      const hash = location.hash.slice(1) || "/dashboard";
      const segments = hash.split("/");
      const baseRoute = "/" + segments[1].split('?')[0];
      const viewFunc = routes[baseRoute] || routes[hash] || renderDashboard;
      const appContainer = document.getElementById('app');
      appContainer.innerHTML = '';
      await viewFunc(appContainer, hash);
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
</body>
</html>
