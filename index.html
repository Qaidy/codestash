    window.toggleMobileMenu = function () {
      const drawer = document.getElementById('mobile-drawer');
      if (drawer) drawer.classList.toggle('hidden');
    }

    function getPrismLangClass(lang) {
      const l = (lang || '').toLowerCase();
      if (l === 'js' || l === 'javascript') return 'language-javascript';
      if (l === 'html' || l === 'css') return `language-${l}`;
      if (l === 'dart') return 'language-dart';
      if (l === 'php') return 'language-php';
      if (l === 'python') return 'language-python';
      if (l === 'sql') return 'language-sql';
      return 'language-javascript';
    }

    // --- 1. LOGIN VIEW ---
    async function renderLogin(container) {
      const { data: { session } } = await db.auth.getSession();
      if (session) { location.hash = '#/dashboard'; return; }

      container.innerHTML = `
        <div class="flex-1 flex items-center justify-center p-4 sm:p-6 bg-bg w-full min-h-screen">
          <div class="bg-surface border-2 border-border-color p-6 sm:p-8 w-full max-w-md shadow-neubrutal">
            <div class="text-center mb-6">
              <div class="inline-block bg-primary border-2 border-border-color p-3 font-black text-2xl shadow-neubrutal mb-2">CS</div>
              <h2 class="text-xl sm:text-2xl font-extrabold">SIGN IN TO CODESTASH</h2>
              <p class="text-xs sm:text-sm text-text-secondary mt-1">Akses kembali koleksi kode snippet Anda.</p>
            </div>
            
            <div id="auth-error" class="hidden mb-4 p-3 bg-accent-pink border-2 border-border-color text-xs sm:text-sm font-bold"></div>

            <form id="login-form" class="space-y-4">
              <div>
                <label class="block text-xs font-bold uppercase mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full border-2 border-border-color p-3 bg-surface text-sm font-medium focus:outline-none" placeholder="developer@example.com">
              </div>
              <div>
                <label class="block text-xs font-bold uppercase mb-1">Password</label>
                <input type="password" id="password" required class="w-full border-2 border-border-color p-3 bg-surface text-sm font-medium focus:outline-none" placeholder="••••••••">
              </div>
              <button type="submit" class="w-full bg-primary border-2 border-border-color py-3 font-bold text-sm shadow-neubrutal hover:shadow-neubrutal-sm transition-all mt-2"><i class="fa-solid fa-right-to-bracket mr-1"></i> Sign In</button>
            </form>
            <p class="text-center text-xs sm:text-sm font-medium mt-4">Belum punya akun? <a href="#/register" class="font-bold underline">Register di sini</a></p>
          </div>
        </div>
      `;

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errBox = document.getElementById('auth-error');
        errBox.classList.add('hidden');

        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) {
          errBox.textContent = error.message;
          errBox.classList.remove('hidden');
        } else {
          location.hash = '#/dashboard';
        }
      });
    }

      `;

      container.innerHTML = await renderLayout('dashboard', contentHtml);

          badgeEl.innerHTML = '<i class="fa-solid fa-lock mr-1"></i> PRIVATE SNIPPETS';
        } else if (langQuery) {
          const matchedCat = categories.find(c => c.code.toLowerCase() === langQuery.toLowerCase());
          const catName = matchedCat ? matchedCat.name : langQuery.toUpperCase();
          badgeEl.innerHTML = `<i class="fa-solid fa-code mr-1"></i> ${escapeHtml(catName)} SNIPPETS`;
        } else {
          badgeEl.innerHTML = '<i class="fa-solid fa-layer-group mr-1"></i> ALL SNIPPETS';
        }
      }

      await fetchAndRenderSnippets();

      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('search-clear-btn');

      const onSearchInput = () => {
        const val = (searchInput?.value || '').trim();
        if (clearBtn) {
          clearBtn.classList.toggle('hidden', !val);
        }
        applySnippetsFilter();
      };

      if (searchInput) {
        searchInput.addEventListener('input', onSearchInput);
        searchInput.addEventListener('search', onSearchInput);
        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            window.clearSearch();
          }
        });

    window.clearSearch = function () {
      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('search-clear-btn');
      if (searchInput) {
        searchInput.value = '';
        searchInput.focus();
      }
      if (clearBtn) clearBtn.classList.add('hidden');
      applySnippetsFilter();
    };

    function matchCategory(snippetLang, filterCode) {
      if (!filterCode) return true;
      const s = (snippetLang || '').toLowerCase().trim();
      const f = (filterCode || '').toLowerCase().trim();
      if (!s) return false;

      if (f === 'html' || f === 'css' || f === 'html,css' || f === 'html & css') {
        return s === 'html' || s === 'css' || s.includes('html') || s.includes('css');
      }
      if (f === 'javascript' || f === 'js') {
        return s === 'javascript' || s === 'js' || s.includes('javascript') || s.includes('typescript') || s === 'ts';
      }
      if (f === 'dart' || f === 'flutter') {
        return s === 'dart' || s === 'flutter' || s.includes('dart') || s.includes('flutter');
      }
      if (f === 'php' || f === 'laravel') {
        return s === 'php' || s === 'laravel' || s.includes('php') || s.includes('laravel');
      }
      if (f === 'python' || f === 'py') {
        return s === 'python' || s === 'py' || s.includes('python');
      }
      if (f === 'sql' || f === 'database') {
        return s.includes('sql') || s.includes('postgres') || s.includes('mysql');
      }
      return s === f || s.includes(f) || f.includes(s);
    }

    async function fetchAndRenderSnippets(forceRefresh = false) {
      const grid = document.getElementById('snippets-grid');
      if (!grid) return;

      if (!snippetsCache || forceRefresh) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 font-bold text-text-secondary"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat snippets...</div>';
        const { data, error } = await db.from('snippets').select('*').order('created_at', { ascending: false });
        if (error) {
          grid.innerHTML = `<div class="col-span-full p-6 bg-accent-pink border-2 border-border-color font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Gagal memuat data: ${error.message}</div>`;
          return;
        }
        snippetsCache = data || [];
      }

      applySnippetsFilter();
    }

    function applySnippetsFilter() {
      const grid = document.getElementById('snippets-grid');
      if (!grid || !snippetsCache) return;

      const searchInput = document.getElementById('search-input');
      const searchVal = (searchInput?.value || '').toLowerCase().trim();

      const urlParams = new URLSearchParams(window.location.hash.split('?')[1] || '');
      const privacyQuery = urlParams.get('privacy');
      const langQuery = urlParams.get('lang') || '';

      const filtered = snippetsCache.filter(s => {
        // Privacy filter
        if (privacyQuery === 'public' && !s.is_public) return false;
        if (privacyQuery === 'private') {
          if (s.is_public || s.user_id !== currentUser?.id) return false;
        }

        // Category / Language filter
        if (langQuery && !matchCategory(s.language, langQuery)) {
          return false;
        }

        // Search filter (Title, Language, Tags, Code Content)
        if (searchVal) {
          const matchTitle = (s.title || '').toLowerCase().includes(searchVal);
          const matchLanguage = (s.language || '').toLowerCase().includes(searchVal);
          const matchContent = (s.code_content || '').toLowerCase().includes(searchVal);
          const matchTags = Array.isArray(s.tags)
            ? s.tags.some(t => (t || '').toLowerCase().includes(searchVal))
            : (typeof s.tags === 'string' && s.tags.toLowerCase().includes(searchVal));

          if (!matchTitle && !matchLanguage && !matchContent && !matchTags) {
            return false;
          }
        }

        return true;
      });

      if (filtered.length === 0) {
        const isFiltered = langQuery || searchVal || privacyQuery;
        grid.innerHTML = `
          <div class="col-span-full bg-surface border-2 border-border-color p-8 sm:p-12 text-center shadow-neubrutal">
            <div class="inline-flex p-3 sm:p-4 bg-yellow-100 border-2 border-black shadow-neubrutal-sm mb-4">
              <i class="fa-solid fa-magnifying-glass text-xl sm:text-2xl text-black"></i>
            </div>
            <p class="font-extrabold text-base sm:text-lg mb-1">${isFiltered ? 'Tidak ada snippet yang cocok' : 'Belum ada snippet ditemukan'}</p>
            <p class="text-xs text-text-secondary font-bold mb-5">${searchVal ? `Kata kunci "${escapeHtml(searchVal)}" tidak ditemukan.` : 'Coba ubah kata kunci pencarian atau kategori bahasa.'}</p>
            <div class="flex items-center justify-center gap-3 flex-wrap">
              ${searchVal ? `<button onclick="clearSearch()" class="border-2 border-black px-4 py-2 font-bold text-xs bg-surface shadow-neubrutal-sm hover:translate-x-[-1px] hover:translate-y-[-1px] hover:shadow-neubrutal active:translate-x-0 active:translate-y-0 transition-all"><i class="fa-solid fa-xmark mr-1"></i> Hapus Pencarian</button>` : ''}
              ${langQuery || privacyQuery ? `<a href="#/dashboard" class="inline-block bg-white border-2 border-black px-4 py-2 font-bold text-xs shadow-neubrutal-sm hover:translate-x-[-1px] hover:translate-y-[-1px] hover:shadow-neubrutal active:translate-x-0 active:translate-y-0 transition-all"><i class="fa-solid fa-arrow-left mr-1"></i> Semua Snippet</a>` : ''}
              <a href="#/new" class="inline-block bg-primary border-2 border-black px-4 py-2 font-bold text-xs shadow-neubrutal-sm hover:translate-x-[-1px] hover:translate-y-[-1px] hover:shadow-neubrutal hover:bg-yellow-300 active:translate-x-0 active:translate-y-0 transition-all"><i class="fa-solid fa-plus mr-1"></i> Buat Snippet</a>
            </div>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(s => `
        <div class="bg-surface border-2 border-border-color p-5 shadow-neubrutal flex flex-col justify-between space-y-4 hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-neubrutal-lg transition-all cursor-pointer" onclick="if(event.target.tagName !== 'BUTTON') location.hash='#/detail/${s.id}'">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="bg-secondary border-2 border-border-color px-2 py-0.5 text-xs font-bold uppercase"><i class="fa-solid fa-code mr-1"></i> ${escapeHtml(s.language)}</span>
              <span class="text-xs font-bold px-2 py-0.5 border border-black ${s.is_public ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}"><i class="fa-solid ${s.is_public ? 'fa-globe' : 'fa-lock'} mr-1"></i> ${s.is_public ? 'Public' : 'Private'}</span>
            </div>
            <h3 class="font-extrabold text-lg line-clamp-1 mb-1 hover:underline">${escapeHtml(s.title)}</h3>
            <div class="flex flex-wrap gap-1 mb-3">
              ${(Array.isArray(s.tags) ? s.tags : []).map(t => `<span class="bg-bg border border-black px-1.5 py-0.5 text-[10px] font-bold">#${escapeHtml(t)}</span>`).join('')}
            </div>
            
            <div class="border-2 border-border-color max-h-36 overflow-hidden relative">
              <pre class="${getPrismLangClass(s.language)}"><code>${escapeHtml(s.code_content)}</code></pre>
            </div>
          </div>
          <div class="flex items-center justify-between pt-2 border-t-2 border-border-color">
            <button onclick="event.stopPropagation(); copySnippetCode(this, \`${encodeURIComponent(s.code_content)}\`)" class="border-2 border-border-color px-3 py-1 font-bold text-xs bg-primary shadow-neubrutal-sm hover:bg-yellow-300"><i class="fa-regular fa-copy mr-1"></i> Copy Code</button>
            <span class="text-xs font-bold text-text-secondary hover:underline">Lihat Detail <i class="fa-solid fa-arrow-right ml-0.5"></i></span>
          </div>
        </div>
      `).join('');

      if (window.Prism) Prism.highlightAll();
    }

    window.copySnippetCode = function (btn, encodedCode) {
      const code = decodeURIComponent(encodedCode);
      navigator.clipboard.writeText(code).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> Copied!';
        btn.classList.add('bg-secondary');
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('bg-secondary');
        }, 1500);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

      "/": renderDashboard,
      "/dashboard": renderDashboard,

    };

    async function router() {
      const hash = location.hash.slice(1) || "/dashboard";
      const pathOnly = hash.split("?")[0];
      const segments = pathOnly.split("/");
      const baseRoute = "/" + segments[1];

      const viewFunc = routes[baseRoute] || routes[pathOnly] || renderDashboard;

      const appContainer = document.getElementById('app');
      appContainer.innerHTML = '';
      await viewFunc(appContainer, hash);
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
</body>

</html>
